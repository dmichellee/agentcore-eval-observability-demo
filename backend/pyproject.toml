[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "VroomDash"
version = "0.1.0"
description = "Vroom&Dash 장난감 자동차 고객 지원 에이전트"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.0.3",
    "boto3 >= 1.35.0",
    "botocore[crt] >= 1.35.0",
    "mcp >= 1.19.0",
    "strands-agents >= 1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tools", "data"]
include = ["main.py", "system_prompt.py", "gateway_auth.py"]
